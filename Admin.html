  <!DOCTYPE html>
<html>
<head>
  <title>Admin Panel – Mathole Bakery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff5f7;
      color: #4a235a;
      max-width: 800px;
      margin: 20px auto;
      padding: 10px;
    }
    h1, h2 {
      text-align: center;
      color: #ff66b2;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      background: #ff66b2;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #e655a3;
    }
    .product-card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
    .qty-group {
      background: #f7e8f0;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .edit-btn {
      background: #4a90e2;
    }
    .delete-btn {
      background: #d9534f;
    }
  </style>
</head>

<body>

<h1>Owner Admin Panel</h1>

<!-- LOGIN SCREEN -->
<div id="loginSection">
  <h2>Enter Admin Password</h2>
  <input type="password" id="adminPass" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none;">

  <h2>Add New Product</h2>

  <input type="text" id="pName" placeholder="Product name">
  <input type="text" id="pImage" placeholder="Image URL">
  <textarea id="pDesc" placeholder="Description (optional)"></textarea>

  <h3>Quantities & Prices</h3>
  <div id="qtyContainer"></div>
  <button onclick="addQtyField()">+ Add Quantity</button>
  <br><br>

  <button onclick="addProduct()">Add Product</button>

  <h2>Your Products</h2>
  <div id="productList"></div>

</div>

<script>
/* PASSWORD */
const ADMIN_PASSWORD = "Mathole123";

/* QUANTITY INPUT SYSTEM */
function addQtyField(q="", p="") {
  const container = document.getElementById("qtyContainer");
  const div = document.createElement("div");
  div.className = "qty-group";

  div.innerHTML = `
    <input type="text" placeholder="Quantity (e.g., 5 Litre)" class="qty" value="${q}">
    <input type="text" placeholder="Price (e.g., R230)" class="price" value="${p}">
    <button onclick="this.parentElement.remove()">Remove</button>
  `;

  container.appendChild(div);
}

/* LOGIN */
function login() {
  const pass = document.getElementById("adminPass").value;
  if (pass === ADMIN_PASSWORD) {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    loadProducts();
  } else {
    alert("Incorrect password!");
  }
}

/* STORAGE */
function getProducts() {
  return JSON.parse(localStorage.getItem("products") || "[]");
}
function saveProducts(list) {
  localStorage.setItem("products", JSON.stringify(list));
}

/* ADD PRODUCT */
function addProduct() {
  const name = document.getElementById("pName").value.trim();
  const image = document.getElementById("pImage").value.trim();
  const desc = document.getElementById("pDesc").value.trim();

  const qtyDivs = document.querySelectorAll(".qty-group");
  if (!name || qtyDivs.length === 0) {
    alert("Product name and at least 1 quantity required.");
    return;
  }

  const quantities = [];
  qtyDivs.forEach(div => {
    const q = div.querySelector(".qty").value.trim();
    const p = div.querySelector(".price").value.trim();
    if (q && p) quantities.push({ q, p });
  });

  if (quantities.length === 0) {
    alert("Please fill in quantity and price.");
    return;
  }

  const products = getProducts();
  products.push({ name, image, desc, quantities });
  saveProducts(products);

  document.getElementById("qtyContainer").innerHTML = "";
  document.getElementById("pName").value = "";
  document.getElementById("pImage").value = "";
  document.getElementById("pDesc").value = "";

  loadProducts();
}

/* DELETE PRODUCT */
function deleteProduct(i) {
  const list = getProducts();
  list.splice(i, 1);
  saveProducts(list);
  loadProducts();
}

/* EDIT PRODUCT */
function editProduct(i) {
  const list = getProducts();
  const p = list[i];

  const name = prompt("Edit name:", p.name);
  const image = prompt("Edit image URL:", p.image);
  const desc = prompt("Edit description:", p.desc);

  if (!name) return alert("Name cannot be empty.");

  // Edit quantities
  let qtyString = "";
  p.quantities.forEach(qp => {
    qtyString += `${qp.q}:${qp.p},`;
  });

  const newQty = prompt(
    "Edit quantities & prices.\nFormat:\n5 Litre:R230,10 Litre:R350\n\nCurrent:",
    qtyString.slice(0,-1)
  );

  const qtyList = [];
  newQty.split(",").forEach(pair => {
    if (!pair.includes(":")) return;
    const [q, pz] = pair.split(":");
    qtyList.push({ q: q.trim(), p: pz.trim() });
  });

  list[i] = { name, image, desc, quantities: qtyList };
  saveProducts(list);
  loadProducts();
}

/* DISPLAY PRODUCTS */
function loadProducts() {
  const list = getProducts();
  const container = document.getElementById("productList");
  container.innerHTML = "";

  list.forEach((p, i) => {
    let qtyHTML = "";
    p.quantities.forEach(qp => {
      qtyHTML += `<p>${qp.q} — ${qp.p}</p>`;
    });

    container.innerHTML += `
      <div class="product-card">
        <h3>${p.name}</h3>
        ${p.image ? `<img src="${p.image}" style="width:100%;border-radius:8px;">` : ""}
        <p>${p.desc || ""}</p>
        <h4>Quantities:</h4>
        ${qtyHTML}
        <button class="edit-btn" onclick="editProduct(${i})">Edit</button>
        <button class="delete-btn" onclick="deleteProduct(${i})">Delete</button>
      </div>
    `;
  });
}
</script>

</body>
</html>
