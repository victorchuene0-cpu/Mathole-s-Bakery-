<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Mathole Bakery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff5f7;
      color: #4a235a;
      max-width: 800px;
      margin: 20px auto;
    }
    h1, h2 {
      text-align: center;
      color: #ff66b2;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background: #ff66b2;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #e655a3;
    }
    .product-card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
    .edit-btn {
      background: #ffc107;
      margin-top: 5px;
    }
    .delete-btn {
      background: #f44336;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<h1>Admin Login</h1>

<div id="loginSection">
  <input type="password" id="adminPass" placeholder="Enter Password">
  <button onclick="login()">Login</button>
</div>

<div id="adminPanel" style="display:none;">

  <h2>Add / Edit Product</h2>

  <input type="hidden" id="editIndex">

  <input type="text" id="pName" placeholder="Product Name">
  <input type="text" id="pPrice" placeholder="Price (e.g., R350)">
  <input type="text" id="pImage" placeholder="Image URL">
  
  <select id="pCategory">
    <option value="">Select Category</option>
    <option>Scones</option>
    <option>Biscuits</option>
    <option>Cupcakes</option>
    <option>Cakes</option>
    <option>Specials</option>
    <option>Cookies</option>
    <option>Custom Orders</option>
  </select>

  <textarea id="pDesc" placeholder="Description"></textarea>

  <label>
    <input type="checkbox" id="pFeatured"> Mark as Featured Product
  </label>

  <button onclick="saveProduct()">Save Product</button>

  <h2>Current Products</h2>
  <div id="productList"></div>

</div>

<script>
const ADMIN_PASSWORD = "Mathole123"; // change password anytime

function login() {
  const pass = document.getElementById("adminPass").value;
  if (pass === ADMIN_PASSWORD) {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    loadProducts();
  } else {
    alert("Incorrect password!");
  }
}

function getProducts() {
  return JSON.parse(localStorage.getItem("products") || "[]");
}

function saveProducts(list) {
  localStorage.setItem("products", JSON.stringify(list));
}

function saveProduct() {
  const name = pName.value.trim();
  const price = pPrice.value.trim();
  const image = pImage.value.trim();
  const desc = pDesc.value.trim();
  const category = pCategory.value;
  const featured = pFeatured.checked;
  const editIndex = document.getElementById("editIndex").value;

  if (!name || !price || !category) {
    alert("Name, price, and category are required.");
    return;
  }

  let products = getProducts();
  const newProduct = { name, price, image, desc, category, featured };

  if (editIndex === "") {
    products.push(newProduct);
  } else {
    products[editIndex] = newProduct;
  }

  saveProducts(products);
  loadProducts();

  pName.value = "";
  pPrice.value = "";
  pImage.value = "";
  pDesc.value = "";
  pCategory.value = "";
  pFeatured.checked = false;
  editIndex.value = "";
}

function loadProducts() {
  const products = getProducts();
  const container = document.getElementById("productList");
  container.innerHTML = "";

  products.forEach((p, i) => {
    container.innerHTML += `
      <div class="product-card">
        <h3>${p.name}</h3>
        <p><strong>Price:</strong> ${p.price}</p>
        <p><strong>Category:</strong> ${p.category}</p>
        <p><strong>Featured:</strong> ${p.featured ? "Yes" : "No"}</p>
        <p>${p.desc}</p>
        <img src="${p.image}" style="max-width:100%; border-radius:6px;margin-top:10px">

        <button class="edit-btn" onclick="editProduct(${i})">Edit</button>
        <button class="delete-btn" onclick="deleteProduct(${i})">Delete</button>
      </div>
    `;
  });
}

function editProduct(index) {
  const p = getProducts()[index];

  pName.value = p.name;
  pPrice.value = p.price;
  pImage.value = p.image;
  pDesc.value = p.desc;
  pCategory.value = p.category;
  pFeatured.checked = p.featured;
  editIndex.value = index;
}

function deleteProduct(index) {
  const products = getProducts();
  products.splice(index, 1);
  saveProducts(products);
  loadProducts();
}
</script>

</body>
</html>

    <input id="pName" placeholder="Product Name">
    <input id="pPrice" placeholder="Price (e.g., R50)">
    <input id="pImage" placeholder="Image URL">
    <textarea id="pDesc" placeholder="Description"></textarea>

    <label>Category</label>
    <select id="pCategory">
      <option>Scones</option>
      <option>Biscuits</option>
      <option>Cupcakes</option>
      <option>Cakes</option>
      <option>Specials</option>
      <option>Cookies</option>
      <option>Custom Orders</option>
    </select>

    <label>
      <input type="checkbox" id="pFeatured"> ⭐ Make Featured Product
    </label>

    <button onclick="saveProduct()">Save Product</button>
  </div>

  <div class="card">
    <h2>All Products</h2>
    <div id="productList"></div>
  </div>
</div>

<script>
/* ---------------- PASSWORD LOGIN ---------------- */
const ADMIN_PASS = "Mathole123";

function login() {
  const pass = document.getElementById("adminPassword").value;
  if (pass === ADMIN_PASS) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    loadProducts();
  } else {
    alert("Wrong password!");
  }
}

/* ---------------- STORAGE ---------------- */
function getProducts() {
  return JSON.parse(localStorage.getItem("products") || "[]");
}
function saveProducts(data) {
  localStorage.setItem("products", JSON.stringify(data));
}

/* ---------------- ADD / EDIT PRODUCT ---------------- */
let editIndex = null;

function saveProduct() {
  const name = document.getElementById("pName").value;
  const price = document.getElementById("pPrice").value;
  const image = document.getElementById("pImage").value;
  const desc = document.getElementById("pDesc").value;
  const category = document.getElementById("pCategory").value;
  const featured = document.getElementById("pFeatured").checked;

  if (!name || !price) return alert("Name & Price are required");

  let products = getProducts();

  if (featured) {
    products.forEach(p => p.featured = false);
  }

  const productData = { name, price, image, desc, category, featured };

  if (editIndex !== null) {
    products[editIndex] = productData;
    editIndex = null;
  } else {
    products.push(productData);
  }

  saveProducts(products);
  loadProducts();
  clearForm();
}

function clearForm() {
  document.getElementById("pName").value = "";
  document.getElementById("pPrice").value = "";
  document.getElementById("pImage").value = "";
  document.getElementById("pDesc").value = "";
  document.getElementById("pFeatured").checked = false;
}

/* ---------------- LIST PRODUCTS ---------------- */
function loadProducts() {
  const list = getProducts();
  const container = document.getElementById("productList");
  container.innerHTML = "";

  list.forEach((p, i) => {
    container.innerHTML += `
      <div class="product-card">
        <h3>${p.name} ${p.featured ? "⭐" : ""}</h3>
        <p>${p.price}</p>
        <p><b>Category:</b> ${p.category}</p>
        <p>${p.desc}</p>
        <img src="${p.image}" style="width:100%; border-radius:6px;">
        <button class="edit-btn" onclick="editProduct(${i})">Edit</button>
        <button class="delete-btn" onclick="deleteProduct(${i})">Delete</button>
      </div>
    `;
  });
}

/* ---------------- DELETE PRODUCT ---------------- */
function deleteProduct(i) {
  let list = getProducts();
  list.splice(i, 1);
  saveProducts(list);
  loadProducts();
}

/* ---------------- EDIT PRODUCT ---------------- */
function editProduct(i) {
  const p = getProducts()[i];

  document.getElementById("pName").value = p.name;
  document.getElementById("pPrice").value = p.price;
  document.getElementById("pImage").value = p.image;
  document.getElementById("pDesc").value = p.desc;
  document.getElementById("pCategory").value = p.category;
  document.getElementById("pFeatured").checked = p.featured;

  editIndex = i;
}
</script>

</body>
</html>
