<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Mathole Bakery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffe6f2;
      margin: 0;
      padding: 20px;
      color: #4a235a;
    }

    h1, h2 {
      text-align: center;
      color: #ff66b2;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 20px auto;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    button {
      background: #ff66b2;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #e655a3;
    }

    .product-card {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }

    .delete-btn {
      background: red;
      margin-top: 10px;
    }

    .edit-btn {
      background: #8b3af3;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>🍰 Admin Panel</h1>

<!-- LOGIN BOX -->
<div id="loginBox" class="card">
  <h2>Owner Login</h2>
  <input type="password" id="adminPassword" placeholder="Enter Password">
  <button onclick="login()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none;">

  <div class="card">
    <h2>Add / Edit Product</h2>

    <input id="pName" placeholder="Product Name">
    <input id="pPrice" placeholder="Price (e.g., R50)">
    <input id="pImage" placeholder="Image URL">
    <textarea id="pDesc" placeholder="Description"></textarea>

    <label>Category</label>
    <select id="pCategory">
      <option>Scones</option>
      <option>Biscuits</option>
      <option>Cupcakes</option>
      <option>Cakes</option>
      <option>Specials</option>
      <option>Cookies</option>
      <option>Custom Orders</option>
    </select>

    <label>
      <input type="checkbox" id="pFeatured"> ⭐ Make Featured Product
    </label>

    <button onclick="saveProduct()">Save Product</button>
  </div>

  <div class="card">
    <h2>All Products</h2>
    <div id="productList"></div>
  </div>
</div>

<script>
/* ---------------- PASSWORD LOGIN ---------------- */
const ADMIN_PASS = "Mathole123";

function login() {
  const pass = document.getElementById("adminPassword").value;
  if (pass === ADMIN_PASS) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    loadProducts();
  } else {
    alert("Wrong password!");
  }
}

/* ---------------- STORAGE ---------------- */
function getProducts() {
  return JSON.parse(localStorage.getItem("products") || "[]");
}
function saveProducts(data) {
  localStorage.setItem("products", JSON.stringify(data));
}

/* ---------------- ADD / EDIT PRODUCT ---------------- */
let editIndex = null;

function saveProduct() {
  const name = document.getElementById("pName").value;
  const price = document.getElementById("pPrice").value;
  const image = document.getElementById("pImage").value;
  const desc = document.getElementById("pDesc").value;
  const category = document.getElementById("pCategory").value;
  const featured = document.getElementById("pFeatured").checked;

  if (!name || !price) return alert("Name & Price are required");

  let products = getProducts();

  if (featured) {
    products.forEach(p => p.featured = false);
  }

  const productData = { name, price, image, desc, category, featured };

  if (editIndex !== null) {
    products[editIndex] = productData;
    editIndex = null;
  } else {
    products.push(productData);
  }

  saveProducts(products);
  loadProducts();
  clearForm();
}

function clearForm() {
  document.getElementById("pName").value = "";
  document.getElementById("pPrice").value = "";
  document.getElementById("pImage").value = "";
  document.getElementById("pDesc").value = "";
  document.getElementById("pFeatured").checked = false;
}

/* ---------------- LIST PRODUCTS ---------------- */
function loadProducts() {
  const list = getProducts();
  const container = document.getElementById("productList");
  container.innerHTML = "";

  list.forEach((p, i) => {
    container.innerHTML += `
      <div class="product-card">
        <h3>${p.name} ${p.featured ? "⭐" : ""}</h3>
        <p>${p.price}</p>
        <p><b>Category:</b> ${p.category}</p>
        <p>${p.desc}</p>
        <img src="${p.image}" style="width:100%; border-radius:6px;">
        <button class="edit-btn" onclick="editProduct(${i})">Edit</button>
        <button class="delete-btn" onclick="deleteProduct(${i})">Delete</button>
      </div>
    `;
  });
}

/* ---------------- DELETE PRODUCT ---------------- */
function deleteProduct(i) {
  let list = getProducts();
  list.splice(i, 1);
  saveProducts(list);
  loadProducts();
}

/* ---------------- EDIT PRODUCT ---------------- */
function editProduct(i) {
  const p = getProducts()[i];

  document.getElementById("pName").value = p.name;
  document.getElementById("pPrice").value = p.price;
  document.getElementById("pImage").value = p.image;
  document.getElementById("pDesc").value = p.desc;
  document.getElementById("pCategory").value = p.category;
  document.getElementById("pFeatured").checked = p.featured;

  editIndex = i;
}
</script>

</body>
</html>
