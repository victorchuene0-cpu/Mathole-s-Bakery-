<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathole Bakery Admin</title>

  <style>
    :root {
      --pink: #f8c7d0;
      --pink-dark: #e4a9b7;
      --gold: #e8d3a8;
      --text: #4a3b3b;
      --light: #fff7f9;
      --border: #e8d3d8;
      --radius: 14px;
      --shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: var(--light);
      color: var(--text);
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px 15px;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      color: var(--pink-dark);
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.4rem;
      margin-bottom: 12px;
      color: var(--pink-dark);
    }

    /* Card */
    .card {
      background: white;
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 15px;
      background: #fff;
    }

    textarea { resize: vertical; }

    button {
      background: var(--pink);
      border: none;
      padding: 12px 20px;
      border-radius: var(--radius);
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      background: var(--pink-dark);
    }

    .danger {
      background: #e57373;
    }

    .danger:hover {
      background: #d9534f;
    }

    .small-btn {
      padding: 8px 14px;
      font-size: 0.9rem;
    }

    .product-card {
      background: var(--light);
      padding: 15px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 15px;
    }

    .product-card img {
      width: 100%;
      border-radius: var(--radius);
      margin-top: 10px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      z-index: 999;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: var(--radius);
      width: 90%;
      max-width: 350px;
      border: 2px solid var(--pink);
      box-shadow: var(--shadow);
    }
  </style>
</head>

<body>

<div class="modal-overlay" id="loginModal">
  <div class="modal-content">
    <h2 style="text-align:center;">🔐 Admin Login</h2>
    <label>Password</label>
    <input type="password" id="adminPass" placeholder="Enter password">
    <button id="loginBtn" style="width:100%; margin-top:10px;">Login</button>
    <p id="loginError" style="color:red; display:none; text-align:center; margin-top:10px;">Incorrect password</p>
  </div>
</div>

<div class="container" id="adminPanel" style="display:none;">

  <h1>🍰 Mathole Bakery Admin</h1>

  <div class="card">
    <h2>Add / Edit Product</h2>

    <input type="hidden" id="editIndex">

    <label>Product Name</label>
    <input id="pName" placeholder="e.g. Chocolate Cupcakes">

    <label>Price (R)</label>
    <input id="pPrice" placeholder="e.g. 150">

    <label>Image URL</label>
    <input id="pImage" placeholder="https://...">

    <label>Category</label>
    <select id="pCategory">
      <option value="">Select Category</option>
      <option>Scones</option>
      <option>Biscuits</option>
      <option>Cupcakes</option>
      <option>Cakes</option>
      <option>Specials</option>
      <option>Cookies</option>
      <option>Custom Orders</option>
    </select>

    <label>Description</label>
    <textarea id="pDesc" placeholder="Short product description"></textarea>

    <label>
      <input type="checkbox" id="pFeatured"> ⭐ Featured Product
    </label>

    <button onclick="saveProduct()" style="margin-top:10px;">Save Product</button>
  </div>

  <div class="card">
    <h2>All Products</h2>
    <div id="productList"></div>
  </div>

</div>

<script>
const ADMIN_PASSWORD = "Mathole123"; // change anytime you want

/* ---------------- LOGIN ---------------- */
document.getElementById("loginBtn").onclick = () => {
  const pass = document.getElementById("adminPass").value;
  if (pass === ADMIN_PASSWORD) {
    document.getElementById("loginModal").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    loadProducts();
  } else {
    document.getElementById("loginError").style.display = "block";
  }
};

/* ---------------- STORAGE ---------------- */
function getProducts() {
  return JSON.parse(localStorage.getItem("products") || "[]");
}

function saveProducts(list) {
  localStorage.setItem("products", JSON.stringify(list));
}

/* ---------------- SAVE PRODUCT ---------------- */
function saveProduct() {
  const name = pName.value.trim();
  const price = pPrice.value.trim();
  const image = pImage.value.trim();
  const desc = pDesc.value.trim();
  const category = pCategory.value;
  const featured = pFeatured.checked;
  const index = editIndex.value;

  if (!name || !price || !category) {
    alert("Product name, price, and category are required.");
    return;
  }

  let list = getProducts();

  if (featured) {
    list.forEach(p => p.featured = false);
  }

  const newProduct = { name, price, image, desc, category, featured };

  if (index === "") {
    list.push(newProduct);
  } else {
    list[index] = newProduct;
  }

  saveProducts(list);
  loadProducts();
  clearForm();
}

/* ---------------- LOAD PRODUCTS ---------------- */
function loadProducts() {
  const list = getProducts();
  productList.innerHTML = "";

  list.forEach((p, i) => {
    productList.innerHTML += `
      <div class="product-card">
        <h3>${p.name} ${p.featured ? "⭐" : ""}</h3>
        <p><strong>Price:</strong> R${p.price}</p>
        <p><strong>Category:</strong> ${p.category}</p>
        <p>${p.desc}</p>
        ${p.image ? `<img src="${p.image}" alt="">` : ""}
        <button class="small-btn" onclick="editProduct(${i})">Edit</button>
        <button class="small-btn danger" onclick="deleteProduct(${i})">Delete</button>
      </div>
    `;
  });
}

/* ---------------- EDIT PRODUCT ---------------- */
function editProduct(i) {
  const p = getProducts()[i];
  pName.value = p.name;
  pPrice.value = p.price;
  pImage.value = p.image;
  pDesc.value = p.desc;
  pCategory.value = p.category;
  pFeatured.checked = p.featured;
  editIndex.value = i;
}

/* ---------------- DELETE PRODUCT ---------------- */
function deleteProduct(i) {
  const list = getProducts();
  list.splice(i, 1);
  saveProducts(list);
  loadProducts();
}

/* ---------------- CLEAR FORM ---------------- */
function clearForm() {
  pName.value = "";
  pPrice.value = "";
  pImage.value = "";
  pDesc.value = "";
  pCategory.value = "";
  pFeatured.checked = false;
  editIndex.value = "";
}
</script>

</body>
</html>
